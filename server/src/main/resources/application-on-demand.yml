server:
  address: 127.0.0.1
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:h2:file:./data/on-demand/robotmall;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ${LOCAL_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
app:
  demo-users: false
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  avatar-dir: ./data/on-demand/avatars
  allowed-origins: ${ALLOWED_ORIGINS:https://chenxiaozao.github.io,http://localhost:5173,http://127.0.0.1:5173}
