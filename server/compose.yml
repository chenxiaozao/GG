services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: robotmall
      MYSQL_USER: robotmall
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://database:3306/robotmall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: robotmall
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://chenxiaozao.github.io}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AVATAR_DIR: /app/data/avatars
    volumes:
      - avatars:/app/data/avatars
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ../web
    ports:
      - "127.0.0.1:8088:80"
    depends_on: [backend]
    restart: unless-stopped
volumes:
  database:
  avatars:
