name: Publish frontend to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate optional HTTPS backend and Pages CORS
        env:
          API_URL: ${{ vars.API_BASE_URL }}
          FRONTEND_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: node web/scripts/validate-public-backend.mjs --check-health
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ROUTER_MODE: hash
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_OFFLINE_ONLY: ${{ vars.API_BASE_URL == '' && 'true' || 'false' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
